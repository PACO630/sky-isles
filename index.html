<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2560" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>雲海群島 Sky Isles</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="title" class="screen">
      <div class="card">
        <div class="logo">✦</div>
        <h1>雲海群島</h1>
        <p class="sub">Sky Isles · 和朋友一起漫遊雲端之上的無盡群島</p>

        <label class="field">
          <span>旅人名字</span>
          <input id="name" maxlength="12" autocomplete="off" placeholder="輸入你的名字" />
        </label>

        <div class="field">
          <span>斗篷顏色</span>
          <div id="swatches" class="swatches"></div>
        </div>

        <label class="field">
          <span>世界代碼 <small>（相同代碼＝同一個世界，可多人一起玩）</small></span>
          <div class="row">
            <input id="world" maxlength="24" autocomplete="off" spellcheck="false" />
            <button id="newWorld" class="ghost" type="button" title="產生新世界">🎲</button>
          </div>
        </label>

        <button id="start" class="primary" type="button">開始旅程</button>
        <p class="hint" id="controlsHint"></p>
      </div>
    </div>

    <div id="hud" class="hidden">
      <div class="panel stats">
        <span title="星光碎片">✦ <b id="sShards">0</b></span>
        <span title="已發現島嶼">⛰ <b id="sIslands">0</b></span>
        <span title="已點亮祭壇">☀ <b id="sAltars">0</b></span>
        <button id="journalBtn" class="mini" type="button" title="旅人日誌 (J)">📖</button>
      </div>
      <div id="compass" class="compass"><div id="compassStrip" class="compass-strip"></div><div class="compass-tick"></div></div>
      <div class="panel room">
        <div class="room-line">
          <span id="netDot" class="dot"></span>
          <span id="roomLabel"></span>
          <span id="peerCount">· 1 人</span>
        </div>
        <div class="room-btns">
          <button id="invite" type="button">邀請朋友</button>
          <button id="friendsBtn" type="button">隊友</button>
        </div>
        <div id="friends" class="friends hidden"></div>
      </div>
      <div id="islandName" class="island-name"></div>
      <div id="toasts" class="toasts"></div>
      <div id="prompt" class="prompt hidden"></div>
      <div id="help" class="help"></div>
      <div id="emotes" class="emotes">
        <button id="emoteToggle" class="emote-toggle" type="button">😊</button>
        <div id="emoteRow" class="emote-row"></div>
      </div>
    </div>

    <div id="modal" class="modal hidden">
      <div class="card modal-card">
        <button id="modalClose" class="modal-close" type="button" aria-label="關閉">✕</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <div id="touch" class="hidden">
      <div id="joyBase" class="joy-base"><div id="joyKnob" class="joy-knob"></div></div>
      <button id="btnInteract" class="tbtn interact" type="button">互動</button>
      <button id="btnJump" class="tbtn jump" type="button">跳躍<small>按住滑翔</small></button>
    </div>

    <div id="fade" class="fade"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
