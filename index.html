<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2560" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>雲海群島 Sky Isles</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2.5 18.5 10 12 21.5 5.5 10Z' fill='%23ffd98a'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="title" class="title-screen">
      <div></div>
      <header class="brand">
        <div class="brand-mark" data-icon="shard"></div>
        <h1>雲海群島</h1>
        <p class="brand-en">SKY ISLES</p>
      </header>
      <div class="menu">
        <div class="fields">
          <label class="line-field">
            <span>旅人</span>
            <input id="name" maxlength="12" autocomplete="off" placeholder="你的名字" />
          </label>
          <div class="line-field">
            <span>斗篷</span>
            <div id="swatches" class="swatches"></div>
          </div>
          <label class="line-field">
            <span>世界</span>
            <input id="world" maxlength="24" autocomplete="off" spellcheck="false" />
            <button id="newWorld" class="icon-btn" type="button" title="產生新世界" data-icon="dice"></button>
          </label>
        </div>
        <button id="start" class="start-btn" type="button">開始旅程</button>
      </div>
      <footer class="title-foot">
        <span>輸入相同的世界代碼，就能和朋友在同一片天空相遇</span>
        <span>v0.4</span>
      </footer>
    </div>

    <div id="hud" class="hidden">
      <div class="stats">
        <span class="stat-shard" title="星光碎片"><i data-icon="shard"></i><b id="sShards">0</b></span>
        <span class="stat-island" title="已發現島嶼"><i data-icon="island"></i><b id="sIslands">0</b></span>
        <span class="stat-altar" title="已點亮祭壇"><i data-icon="altar"></i><b id="sAltars">0</b></span>
      </div>
      <div id="compass" class="compass"><div id="compassStrip" class="compass-strip"></div><div class="compass-tick"></div></div>
      <div class="corner">
        <button id="journalBtn" class="round-btn" type="button" title="旅人日誌 (J)" data-icon="book"></button>
        <div class="social">
          <button id="socialBtn" class="round-btn" type="button" title="朋友"><i data-icon="friends"></i><span id="peerBadge" class="badge hidden"></span></button>
          <div id="socialPanel" class="social-panel hidden">
            <div class="room-line">
              <span id="netDot" class="dot"></span>
              <span id="roomLabel"></span>
              <span id="peerCount">1 人</span>
            </div>
            <button id="invite" class="pill-btn" type="button">邀請朋友</button>
            <div class="panel-label">隊友</div>
            <div id="friends" class="friends"></div>
          </div>
        </div>
      </div>
      <div id="islandName" class="island-name"></div>
      <div id="toasts" class="toasts"></div>
      <div id="prompt" class="prompt hidden"></div>
      <div id="emotes" class="emotes">
        <button id="emoteToggle" class="emote-toggle" type="button" aria-label="表情" data-icon="smile"></button>
        <div id="emoteRow" class="emote-row"></div>
      </div>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-card">
        <button id="modalClose" class="modal-close" type="button" aria-label="關閉">✕</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <div id="touch" class="hidden">
      <div id="joyBase" class="joy-base"><div id="joyKnob" class="joy-knob"></div></div>
      <button id="btnInteract" class="tbtn interact" type="button" aria-label="互動" data-icon="touch"></button>
      <button id="btnJump" class="tbtn jump" type="button" aria-label="跳躍（空中按住滑翔）" data-icon="jump"></button>
    </div>

    <div id="rotate" class="rotate">
      <div class="rotate-phone" data-icon="rotate"></div>
      <p>請將手機轉為橫向</p>
      <small>雲海群島需要橫向遊玩</small>
    </div>

    <div id="fade" class="fade"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
